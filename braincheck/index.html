<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrainCheck</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
  <div class="container py-5 text-center">
    <div class="mb-4">
      <h1 class="display-4 fw-extrabold brand-title mb-1">BrainCheck</h1>
      <p class="text-muted small fw-medium">Upload your study material and test your knowledge</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4" style="max-width: 440px;">
        <div id="setupForm" class="card custom-card p-4 mb-3 text-start">
          <form id="quizForm">
            <div class="mb-3">
              <label for="examType" class="form-label fw-semibold text-secondary small text-uppercase">Select Exam Type</label>
              <select id="examType" class="form-select" required>
                <option value="" disabled selected>Choose type...</option>
                <option value="Multiple Choice">Multiple Choice</option>
                <option value="Identification">Identification</option>
                <option value="True or False">True or False</option>
                <option value="Random Mix">Random Mix</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="itemCount" class="form-label fw-semibold text-secondary small text-uppercase">Number of Items</label>
              <select id="itemCount" class="form-select" required>
                <option value="" disabled selected>Select total questions</option>
                <option value="10">10 Items</option>
                <option value="15">15 Items</option>
                <option value="20">20 Items</option>
                <option value="30">30 Items</option>
                <option value="40">40 Items</option>
                <option value="50">50 Items</option>
              </select>
            </div>

            <div class="mb-4">
              <label for="studyFile" class="form-label fw-semibold text-secondary small text-uppercase">Upload Review Material</label>
              <input type="file" id="studyFile" class="form-control" accept=".pdf,.txt,.docx" required>
              <div class="form-text text-muted small mt-1">Supported formats: .pdf, .txt, .docx</div>
            </div>

            <button type="submit" class="btn btn-primary btn-custom w-100 shadow-sm">Generate Exam</button>
          </form>
        </div>

        <div id="loadingText" style="display: none;" class="card custom-card p-5 mb-3 text-center">
          <div class="spinner-border text-primary mx-auto mb-3" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <h5 class="fw-bold mb-1">Processing File</h5>
          <p class="text-muted small mb-0">Analyzing your review material...</p>
        </div>

        <div id="resultBox" style="display: none;" class="card custom-card p-4 text-center">
          <div class="mb-3">
            <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-2 fw-semibold">
              ✓ Ready to start
            </span>
          </div>
          <h4 class="fw-bold mb-3">Setup Successful!</h4>
          
          <div class="info-badge mb-4 text-start">
            <div class="d-flex justify-content-between mb-2">
              <span class="text-muted small">Type:</span>
              <span id="displayType" class="fw-bold small text-dark"></span>
            </div>
            <div class="d-flex justify-content-between">
              <span class="text-muted small">Total Questions:</span>
              <span id="displayItems" class="fw-bold small text-dark font-mono"></span>
            </div>
          </div>

          <button type="button" id="startBtn" class="btn btn-success btn-custom mb-2 w-100 shadow-sm">Start Exam</button>
          <button type="button" id="changeBtn" class="btn btn-light btn-custom w-100 text-secondary border">Change Setup</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>

</body>

</html>
