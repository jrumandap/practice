<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrainCheck</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body style="background-color: lightgray;">

  <div class="container py-4 text-center">
    
    <h1 class="mb-4">BrainCheck</h1>

    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        
        <div id="setupForm" class="card p-4 shadow-sm mb-3">
          <form id="quizForm">
            <label for="examType" class="form-label">Select Exam Type:</label>
            <select id="examType" class="form-select mb-3" required>
              <option value="" disabled selected>Select</option>
              <option value="Multiple Choice">Multiple Choice</option>
              <option value="Identification">Identification</option>
              <option value="True or False">True or False</option>
              <option value="Random Mix">Random Mix</option>
            </select>

            <label for="itemCount" class="form-label">Number of Items (Max 100):</label>
            <input type="number" id="itemCount" class="form-control mb-3" min="1" max="100" required>

            <button type="submit" class="btn btn-primary w-100">Submit</button>
          </form>
        </div>

        <div id="loadingText" style="display: none;" class="card p-4 shadow-sm mb-3">
          <div class="spinner-border text-primary mx-auto mb-2" role="status"></div>
          <p class="mb-0">Loading...</p>
        </div>

        <div id="resultBox" style="display: none;" class="card p-4 shadow-sm">
          <h3>Setup Successful!</h3>
          <p class="mb-1">Exam Type: <span id="displayType"></span></p>
          <p class="mb-3">Total Items: <span id="displayItems"></span></p>

          <p class="fw-bold">Are you ready?</p>
          <button type="button" id="startBtn" class="btn btn-success mb-2 w-100">Start Exam</button>
          <button type="button" id="changeBtn" class="btn btn-secondary w-100">Change Setup</button>
        </div>

      </div>
    </div>

  </div>

  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  <script src="script.js"></script>

</body>

</html>
