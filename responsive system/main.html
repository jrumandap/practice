<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Responsive System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Responsive System</a>
      <a href="index.html" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0 fw-bold text-primary">Check Responsive</h5>
      </div>
      <div class="card-body">

        <div class="input-group mb-3">
          <input type="text" id="urlInput" class="form-control"
            placeholder="Paste link or local path here">
          <button class="btn btn-primary" type="button" onclick="loadLink()">Load Site</button>
        </div>

        <div class="mb-3 text-center">
          <button class="btn btn-secondary btn-sm me-2 mb-2" onclick="changeSize('360px', '800px')">📱 Phone</button>
          <button class="btn btn-secondary btn-sm me-2 mb-2" onclick="changeSize('800px', '1280px')">📱 Tablet</button>
          <button class="btn btn-secondary btn-sm mb-2" onclick="changeSize('1366px', '768px')">💻 Laptop</button>
        </div>

        <div class="text-center bg-white p-2 border rounded shadow-sm d-flex justify-content-center overflow-auto">
          <iframe id="previewFrame" style="width: 100%; height: 600px; border: 1px solid #ccc;" src=""></iframe>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
